# ─────────────────────────────────────────────────────────────────────────────
# JMeter User Properties Override
# Place this file at: jmeter/user.properties in your repository
# These settings are applied on top of JMeter's default jmeter.properties
# ─────────────────────────────────────────────────────────────────────────────

# ── Result File Save Settings ─────────────────────────────────────────────────
# Save detailed request/response data for better HTML reports
jmeter.save.saveservice.output_format=xml
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.url=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.time=true
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.success=true
jmeter.save.saveservice.label=true
jmeter.save.saveservice.code=true
jmeter.save.saveservice.message=true
jmeter.save.saveservice.encoding=false
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.response_data.on_error=true
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.subresults=false
jmeter.save.saveservice.assertions=true
jmeter.save.saveservice.print_field_names=true

# ── Thread Configuration (can be overridden via -J flag on CLI) ───────────────
# These are defaults - your JMX file settings will take priority
# Override at runtime: jmeter -Jthreads=50 -Jramp_up=60 -Jduration=300
threads=10
ramp_up=30
duration=0

# ── HTTP Settings ─────────────────────────────────────────────────────────────
# Default HTTP connection settings
httpclient.timeout=30000
httpclient.socket.timeout=30000
httpclient.connection.timeout=10000

# ── Logging ───────────────────────────────────────────────────────────────────
# Reduce console output noise in CI
log_level.jmeter=WARN
log_level.jmeter.control=WARN
log_level.jmeter.protocol.http=WARN
