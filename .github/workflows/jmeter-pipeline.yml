name: JMeter Performance Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      jmeter_version:
        description: 'Apache JMeter version to use'
        required: false
        default: '5.6.3'
      threads:
        description: 'Number of concurrent threads (users)'
        required: false
        default: '10'
      ramp_up:
        description: 'Ramp-up period in seconds'
        required: false
        default: '30'
      loops:
        description: 'Loops per thread (threads x loops = total requests, default: 10)'
        required: false
        default: ''
      jmx_path:
        description: 'Optional: path to JMX file (e.g. tests/myplan.jmx). Leave empty to auto-discover all .jmx files in the repo.'
        required: false
        default: ''

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment to Pages
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  JMETER_VERSION: ${{ github.event.inputs.jmeter_version || '5.6.3' }}
  JMETER_HOME: ${{ github.workspace }}/apache-jmeter
  RESULTS_DIR: results
  REPORT_DIR: report

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Run JMeter Tests & Generate HTML Report
  # ─────────────────────────────────────────────
  jmeter-test:
    name: Run JMeter Tests
    runs-on: ubuntu-latest

    steps:
      # ── Checkout repo ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up Java 11 (JMeter 5.6.x supports Java 8 & 11; Java 17 causes NullPointer in report generator) ──
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # ── Cache JMeter installation ──────────────────────────────────────────
      - name: Cache Apache JMeter
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: ${{ env.JMETER_HOME }}
          key: jmeter-${{ env.JMETER_VERSION }}

      # ── Download & install JMeter (only if not cached) ────────────────────
      - name: Download & Install Apache JMeter
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Apache JMeter ${{ env.JMETER_VERSION }}..."
          wget -q "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${{ env.JMETER_VERSION }}.tgz" \
            -O jmeter.tgz
          tar -xzf jmeter.tgz
          mv "apache-jmeter-${{ env.JMETER_VERSION }}" "${{ env.JMETER_HOME }}"
          echo "JMeter installed at: ${{ env.JMETER_HOME }}"

      # ── Verify JMeter installation ─────────────────────────────────────────
      - name: Verify JMeter
        run: |
          ${{ env.JMETER_HOME }}/bin/jmeter --version

      # ── Auto-discover JMX file ─────────────────────────────────────────────
      # Priority: 1) jmx_path input (manual override)  2) auto-find any *.jmx
      - name: Discover JMX file
        id: discover_jmx
        run: |
          MANUAL_PATH="${{ github.event.inputs.jmx_path }}"

          if [ -n "$MANUAL_PATH" ]; then
            # ── Manual override provided ────────────────────────────────────
            if [ ! -f "$MANUAL_PATH" ]; then
              echo "ERROR: Manually specified JMX not found: $MANUAL_PATH"
              exit 1
            fi
            JMX_FILE="$MANUAL_PATH"
            echo "Using manually specified JMX: $JMX_FILE"
          else
            # ── Auto-discovery: find all .jmx files in the repo ────────────
            echo "No jmx_path provided — scanning repo for .jmx files..."
            mapfile -t JMX_FILES < <(find . -name '*.jmx' -not -path './.git/*' | sort)

            if [ ${#JMX_FILES[@]} -eq 0 ]; then
              echo "ERROR: No .jmx files found in the repository."
              echo "Please add your JMeter test plan (.jmx) anywhere in the repo."
              exit 1
            fi

            echo "Found ${#JMX_FILES[@]} JMX file(s):"
            for f in "${JMX_FILES[@]}"; do
              echo "  - $f"
            done

            if [ ${#JMX_FILES[@]} -gt 1 ]; then
              echo "Multiple JMX files found — using the first one."
              echo "To run a specific file, use the 'jmx_path' input in workflow_dispatch."
            fi

            # Strip leading ./ from the path
            JMX_FILE="${JMX_FILES[0]#./}"
          fi

          echo "Selected JMX: $JMX_FILE"
          # Export as step output so subsequent steps can read it
          echo "jmx_file=$JMX_FILE" >> $GITHUB_OUTPUT

      # ── Create results directory only (report dir must be created by jmeter -g, not pre-created) ──────────
      - name: Create results directory
        run: |
          mkdir -p "${{ env.RESULTS_DIR }}"
          # NOTE: Do NOT pre-create REPORT_DIR — jmeter -g will fail if the output dir already exists

      # ── Run JMeter test (non-GUI mode) ─────────────────────────────────────
      - name: Run JMeter Test Plan
        run: |
          JMETER_CMD="${{ env.JMETER_HOME }}/bin/jmeter"
          RESULTS_FILE="${{ env.RESULTS_DIR }}/results.jtl"

          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.threads }}" != "" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -Jthreads=${{ github.event.inputs.threads }}"
          fi
          if [ "${{ github.event.inputs.ramp_up }}" != "" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -Jramp_up=${{ github.event.inputs.ramp_up }}"
          fi
          if [ "${{ github.event.inputs.loops }}" != "" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -Jloops=${{ github.event.inputs.loops }}"
          fi

          JMX_FILE="${{ steps.discover_jmx.outputs.jmx_file }}"
          JMX_DIR="$(dirname "$JMX_FILE")"

          # Auto-detect user.properties: check same dir as JMX first, then repo-wide
          USER_PROPS_ARG=""
          if [ -f "$JMX_DIR/user.properties" ]; then
            USER_PROPS_ARG="-p $JMX_DIR/user.properties"
            echo "Using user.properties: $JMX_DIR/user.properties"
          else
            FOUND_PROPS=$(find . -name 'user.properties' -not -path './.git/*' | head -n1)
            if [ -n "$FOUND_PROPS" ]; then
              USER_PROPS_ARG="-p $FOUND_PROPS"
              echo "Using user.properties: $FOUND_PROPS"
            else
              echo "No user.properties found — using JMeter built-in defaults"
            fi
          fi

          $JMETER_CMD \
            -n \
            -t "$JMX_FILE" \
            -l "$RESULTS_FILE" \
            $USER_PROPS_ARG \
            $EXTRA_ARGS

          echo "JMeter test completed. Results saved to: $RESULTS_FILE"

      # ── Check JTL results file ─────────────────────────────────────────────
      - name: Validate results file
        run: |
          RESULTS_FILE="${{ env.RESULTS_DIR }}/results.jtl"

          if [ ! -f "$RESULTS_FILE" ]; then
            echo "ERROR: Results file not found at $RESULTS_FILE"
            exit 1
          fi

          LINE_COUNT=$(wc -l < "$RESULTS_FILE")
          echo "Results file has $LINE_COUNT lines"

          # Show first 5 lines so we can see the CSV header & sample rows in logs
          echo "--- First 5 lines of results.jtl ---"
          head -n 5 "$RESULTS_FILE"
          echo "-------------------------------------"

          # Must have at least 2 lines: 1 header + 1 sample
          if [ "$LINE_COUNT" -lt 2 ]; then
            echo "ERROR: Results file contains no samples (only $LINE_COUNT line(s)). Cannot generate report."
            exit 1
          fi

          echo "Validation passed: $LINE_COUNT lines found."

      # ── Generate HTML Report ───────────────────────────────────────────────
      - name: Generate HTML Report
        run: |
          RESULTS_FILE="${{ env.RESULTS_DIR }}/results.jtl"
          REPORT_DIR="${{ env.REPORT_DIR }}"

          # Ensure report dir does NOT exist before calling jmeter -g
          rm -rf "$REPORT_DIR"

          echo "Generating HTML report from: $RESULTS_FILE"

          ${{ env.JMETER_HOME }}/bin/jmeter \
            -g "$RESULTS_FILE" \
            -o "$REPORT_DIR"

          echo "HTML report generated at: $REPORT_DIR"
          ls -la "$REPORT_DIR"

      # ── Show test summary in logs ──────────────────────────────────────────
      - name: Print test summary
        run: |
          RESULTS_FILE="${{ env.RESULTS_DIR }}/results.jtl"
          echo "=== JMeter Test Summary ==="
          echo "Report directory size: $(du -sh ${{ env.REPORT_DIR }} | cut -f1)"

      # ── Upload HTML report as GitHub Actions artifact ─────────────────────
      - name: Upload HTML Report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-html-report-${{ github.run_number }}
          path: ${{ env.REPORT_DIR }}/
          retention-days: 30

      # ── Upload raw JTL results as artifact ────────────────────────────────
      - name: Upload Raw JTL Results as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-jtl-results-${{ github.run_number }}
          path: ${{ env.RESULTS_DIR }}/
          retention-days: 30

      # ── Upload report for GitHub Pages deployment ──────────────────────────
      - name: Upload report for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ${{ env.REPORT_DIR }}/

  # ─────────────────────────────────────────────
  # JOB 2: Deploy to GitHub Pages
  # ─────────────────────────────────────────────
  deploy-pages:
    name: Deploy Report to GitHub Pages
    needs: jmeter-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print report URL
        run: |
          echo "JMeter HTML Report deployed to GitHub Pages:"
          echo "${{ steps.deployment.outputs.page_url }}"
